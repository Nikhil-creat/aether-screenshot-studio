name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy Pillow opencv-python-headless PyJWT
        working-directory: backend
      - run: python -m tests.test_core
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests-web/test_core.js
      - run: node tests-web/flow_test.js
      - run: node tests-web/cine_test.js
      - run: npm i --no-save pdf-lib@1.17.1
      - run: node tests-web/pdf_export_test.js
  demo-pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: demo }
      - uses: actions/deploy-pages@v4
