services:
  redis: { image: redis:7-alpine }
  api:
    build: { context: ./backend, args: { WITH_ML: "0" } }   # set "1" for CNN + Chroma + LangGraph
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [.env.example]
    ports: ["8000:8000"]
    depends_on: [redis]
  collab:
    build: ./backend
    command: uvicorn app.collab.server:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery worker -l info
    depends_on: [redis]
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API: "http://localhost:8000", NEXT_PUBLIC_COLLAB: "ws://localhost:8001/collab" }
    depends_on: [api, collab]
